name: Execute SQL on Supabase

on:
  push:
    paths:
      - 'sql/pending/**/*.sql'
      - 'sql/pending/*.sql'

jobs:
  execute-sql:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute new SQL files
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'sql/pending/*.sql' 'sql/pending/**/*.sql')
          echo "Files to execute: $FILES"
          SUCCESS=true
          for FILE in $FILES; do
            [ -f "$FILE" ] || continue
            echo "--- Executing: $FILE ---"
            SQL=$(cat "$FILE")
            # Supabase Management API - execute SQL directement
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/qgdcutklhgnlcrxuvgkn/database/query" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1]).read()}))" "$FILE")")
            echo "HTTP: $HTTP_CODE"
            cat /tmp/resp.json
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "SUCCESS: $FILE"
            else
              echo "FAILED: $FILE (HTTP $HTTP_CODE)"
              SUCCESS=false
            fi
          done
          $SUCCESS || exit 1

      - name: Archive executed SQL
        run: |
          git config user.email "bot@motorsport.app"
          git config user.name "Motorsport Bot"
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'sql/pending/*.sql' 'sql/pending/**/*.sql')
          CHANGED=0
          for FILE in $FILES; do
            if [ -f "$FILE" ]; then
              DEST="sql/done/${FILE#sql/pending/}"
              mkdir -p "$(dirname "$DEST")"
              git mv "$FILE" "$DEST" && CHANGED=1
            fi
          done
          [ $CHANGED -eq 1 ] && git commit -m "chore: archive executed SQL [skip ci]" && git push || echo "Nothing to archive"
